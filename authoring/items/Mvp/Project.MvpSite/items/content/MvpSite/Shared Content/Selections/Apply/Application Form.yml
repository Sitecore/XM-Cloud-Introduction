    - ID: "095894c5-c355-40f8-b47e-045c65af22f2"
      Hint: ContributionsHelpText
      Value: |
        <p><strong>Please add your contributions from December 1st, 2024.</strong></p>
        <p>We are looking for contributions in the following areas:</p>
        <ul>
            <li><strong>Content</strong> includes: Blogs, Videos, Podcasts, White papers, Case studies, Open source modules, but even long format Questions and Answers on StackExchange</li>
            <li><strong>Engagement</strong> includes: Social media, Community forum, LinkedIn, Slack, Discord, Telegram, StackExchange, Reddit, etc.</li>
            <li><strong>Public Speaking</strong> includes: Sitecore User Groups, SUGCON, Symposium, corporate events (DX, Experience Day, etc.), industry conferences, webinars</li>
            <li><strong>Feedback/References</strong> includes: Support tickets, Product feedback through MVP channels or to PMs directly, beta testing products and trainings, customer references, Customer Success Manager recommendations, Partner Advisory Council, Customer Leadership Board or Customer Advisory Board participation</li>
        </ul>
        <p><strong>A balanced application has contributions in all of these areas.</strong></p>
        <p>Tips for a successful application:</p>
        <ul>
            <li>Please select your TOP 30 contributions, but no less than 5!</li>
            <li>DO NOT list all your social media posts one by one! Add your social media profiles in the personal section and we will review them.</li>
            <li>For each entry, please make sure we can validate your contribution (e.g. provide a link).</li>
            <li>Where applicable, please select one or more Sitecore products related to your contribution.</li>
            <li>Only include a bug report if it is a confirmed BUG or a Feature request or a Missing Documentation</li>
            <li><strong>Please remember that we are looking for quality and not quantity.</strong></li>
        </ul>
